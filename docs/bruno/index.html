<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f1e6">
<title>Amigo Secreto · Família Carvalho</title>
<meta property="og:title" content="Amigo Secreto · Família Carvalho">
<meta property="og:description" content="Bruno, toque para descobrir quem você tirou 🎁">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  :root {
    --bg: #f7f1e6;
    --bg-2: #efe4d0;
    --card: #fffdf8;
    --ink: #2b211b;
    --muted: #7a6a5c;
    --red: #b3262d;
    --red-dark: #8c1c22;
    --green: #1f5c43;
    --gold: #d6a23a;
    --line: #e7dcc8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff8ea 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 1px 0 #fff inset, 0 24px 60px -30px rgba(80, 40, 10, .35);
    position: relative;
  }
  .eyebrow {
    margin: 0 0 18px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 700;
  }
  h1 {
    margin: 0 0 8px;
    font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 700;
  }
  .lead { margin: 0 auto 8px; max-width: 30ch; color: var(--muted); font-size: 16px; line-height: 1.5; }

  .gift {
    display: block;
    margin: 8px auto 4px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    width: 190px;
    height: 190px;
    touch-action: manipulation;
  }
  .gift svg { width: 100%; height: 100%; overflow: visible; }
  .gift .wobble { transform-origin: 100px 150px; animation: wobble 2.8s ease-in-out infinite; }
  .gift .lid { transform-origin: 100px 82px; transition: transform .7s cubic-bezier(.2, .9, .3, 1.3), opacity .5s ease .25s; }
  .opened .gift .wobble { animation: none; }
  .opened .gift .lid { transform: translate(14px, -70px) rotate(24deg); opacity: 0; }
  .opened .gift { pointer-events: none; }
  @keyframes wobble {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-4deg); }
    82% { transform: rotate(4deg); }
    88% { transform: rotate(-2deg); }
    94% { transform: rotate(1deg); }
  }

  .btn {
    display: block;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 16px;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--red-dark);
    transition: transform .08s ease, box-shadow .08s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark); }
  .btn:focus-visible, .gift:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    min-height: 44px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 18px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn.ghost:active { transform: none; }

  .result { display: none; animation: rise .6s cubic-bezier(.2, .9, .3, 1.2) both; }
  .opened .result { display: block; }
  .opened .before { display: none; }
  .result .label { margin: 0; color: var(--muted); font-size: 16px; }
  .result .name {
    margin: 6px 0 4px;
    font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 12vw, 52px);
    line-height: 1.05;
    font-weight: 700;
    color: var(--red);
    overflow-wrap: anywhere;
  }
  .result .hint { margin: 12px auto 0; max-width: 28ch; color: var(--muted); font-size: 15px; line-height: 1.5; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i {
    position: absolute;
    top: -12px;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gift .wobble, .confetti { animation: none !important; display: none; }
    .gift .lid, .result { transition: none; animation: none; }
  }
  footer { margin-top: 22px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main id="app">
  <p class="eyebrow">Amigo Secreto · Família Carvalho</p>

  <div class="before">
    <h1>Olá, Bruno!</h1>
    <p class="lead">Seu amigo secreto já foi sorteado. Confira se ninguém está espiando e abra o presente.</p>
  </div>

  <button class="gift" id="gift" type="button" aria-label="Abrir o presente e revelar meu amigo secreto">
<svg viewBox="0 0 200 200" aria-hidden="true">
  <ellipse cx="100" cy="184" rx="62" ry="8" fill="#000" opacity=".08"/>
  <g class="wobble">
    <rect x="36" y="88" width="128" height="92" rx="10" fill="#b3262d"/>
    <path d="M46 88 H154 A10 10 0 0 1 164 98 V104 H36 V98 A10 10 0 0 1 46 88 Z" fill="#8c1c22" opacity=".55"/>
    <rect x="90" y="88" width="20" height="92" fill="#d6a23a"/>
    <g class="lid">
      <rect x="28" y="66" width="144" height="28" rx="8" fill="#c8323a"/>
      <rect x="90" y="66" width="20" height="28" fill="#e2b04a"/>
      <path d="M100 66 C 80 30, 48 40, 60 58 C 66 66, 86 66, 100 66 Z" fill="#d6a23a"/>
      <path d="M100 66 C 120 30, 152 40, 140 58 C 134 66, 114 66, 100 66 Z" fill="#d6a23a"/>
      <path d="M100 66 C 86 48, 66 46, 68 56 C 72 62, 88 64, 100 66 Z" fill="#b8851f" opacity=".5"/>
      <path d="M100 66 C 114 48, 134 46, 132 56 C 128 62, 112 64, 100 66 Z" fill="#b8851f" opacity=".5"/>
      <circle cx="100" cy="66" r="9" fill="#e9bd5a"/>
    </g>
  </g>
</svg></button>

  <div class="before">
    <button class="btn" id="revelar" type="button">Revelar meu amigo secreto</button>
  </div>

  <section class="result" aria-live="polite">
    <p class="label">Bruno, você tirou</p>
    <p class="name" id="nome"></p>
    <p class="hint">Guarde segredo! 🤫<br>Você pode abrir este link de novo quando quiser.</p>
    <button class="btn ghost" id="esconder" type="button">Esconder</button>
  </section>
</main>
<script>
(function () {
  var app = document.getElementById("app");
  var alvo = document.getElementById("nome");
  var dado = "U2FuZHJv";
  function decodificar(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function confete() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cores = ["#b3262d", "#1f5c43", "#d6a23a", "#e9bd5a", "#2f7a5a"];
    var box = document.createElement("div");
    box.className = "confetti";
    for (var i = 0; i < 90; i++) {
      var p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = cores[i % cores.length];
      p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      p.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
      p.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      p.style.animationDelay = (Math.random() * 0.4) + "s";
      if (Math.random() < 0.4) { p.style.width = "8px"; p.style.height = "8px"; p.style.borderRadius = "50%"; }
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 4800);
  }
  function revelar() {
    if (app.classList.contains("opened")) return;
    alvo.textContent = decodificar(dado);
    app.classList.add("opened");
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
    setTimeout(confete, 250);
  }
  function esconder() {
    app.classList.remove("opened");
    alvo.textContent = "";
  }
  document.getElementById("gift").addEventListener("click", revelar);
  document.getElementById("revelar").addEventListener("click", revelar);
  document.getElementById("esconder").addEventListener("click", esconder);
})();
</script>
</body>
</html>
