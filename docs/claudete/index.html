<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f1e6">
<title>Amigo Secreto · Família Carvalho</title>
<meta property="og:title" content="Amigo Secreto · Família Carvalho">
<meta property="og:description" content="Claudete, toque para descobrir quem você tirou 🎁">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  :root {
    --bg: #f7f1e6;
    --bg-2: #efe4d0;
    --card: #fffdf8;
    --ink: #2b211b;
    --muted: #7a6a5c;
    --red: #b3262d;
    --red-dark: #8c1c22;
    --green: #1f5c43;
    --gold: #d6a23a;
    --line: #e7dcc8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -10%, #fff8ea 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 32px 24px 28px;
    text-align: center;
    box-shadow: 0 1px 0 #fff inset, 0 24px 60px -30px rgba(80, 40, 10, .35);
    position: relative;
  }
  .eyebrow {
    margin: 0 0 18px;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 700;
  }
  h1 {
    margin: 0 0 8px;
    font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 34px;
    line-height: 1.1;
    font-weight: 700;
  }
  .lead { margin: 0 auto 8px; max-width: 30ch; color: var(--muted); font-size: 16px; line-height: 1.5; }

  .gift {
    display: block;
    margin: 8px auto 4px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    width: 190px;
    height: 190px;
    touch-action: manipulation;
  }
  .gift svg { width: 100%; height: 100%; overflow: visible; }
  .gift .wobble { transform-origin: 100px 150px; animation: wobble 2.8s ease-in-out infinite; }
  .gift .lid { transform-origin: 100px 82px; transition: transform .7s cubic-bezier(.2, .9, .3, 1.3), opacity .5s ease .25s; }
  .opened .gift .wobble { animation: none; }
  .opened .gift .lid { transform: translate(14px, -70px) rotate(24deg); opacity: 0; }
  .opened .gift { pointer-events: none; }
  @keyframes wobble {
    0%, 70%, 100% { transform: rotate(0); }
    76% { transform: rotate(-4deg); }
    82% { transform: rotate(4deg); }
    88% { transform: rotate(-2deg); }
    94% { transform: rotate(1deg); }
  }

  .btn {
    display: block;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 16px;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--red-dark);
    transition: transform .08s ease, box-shadow .08s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark); }
  .btn:focus-visible, .gift:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    min-height: 44px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 18px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn.ghost:active { transform: none; }

  .result { display: none; animation: rise .6s cubic-bezier(.2, .9, .3, 1.2) both; }
  .revealed .result { display: block; }
  .revealed .gift { display: none; }
  .opened .before { display: none; }

  /* Retrato do amigo secreto: moldura quadrada de bengala doce + gorro */
  .retrato {
    position: relative;
    width: min(220px, 64vw);
    margin: 58px auto 22px;
    transform: rotate(-2.5deg);
    animation: pop .75s cubic-bezier(.2, .9, .3, 1.35) both;
  }
  .retrato .moldura {
    padding: 11px;
    border-radius: 8px;
    background: repeating-linear-gradient(45deg, var(--red) 0 11px, #fff 11px 22px);
    box-shadow: 0 18px 30px -16px rgba(80, 30, 10, .55), 0 0 0 1px rgba(0, 0, 0, .06);
  }
  .retrato .quadro { position: relative; }
  .retrato .foto {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border: 4px solid var(--gold);
    border-radius: 3px;
    background: var(--green);
  }
  .retrato img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .retrato .inicial {
    display: flex;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
    font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 96px;
    font-weight: 700;
    color: #fff;
    background: radial-gradient(circle at 50% 40%, #2f7a5a 0%, var(--green) 70%);
  }
  .retrato .gorro {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 4px 4px rgba(60, 20, 10, .3));
  }
  .retrato .azevinho {
    position: absolute;
    right: -16px;
    bottom: -14px;
    width: 64px;
    z-index: 2;
    pointer-events: none;
    filter: drop-shadow(0 3px 3px rgba(40, 20, 10, .25));
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(40px) scale(.6) rotate(8deg); }
    to { opacity: 1; transform: rotate(-2.5deg); }
  }
  .result .label { margin: 0; color: var(--muted); font-size: 16px; }
  .result .name {
    margin: 6px 0 4px;
    font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 12vw, 52px);
    line-height: 1.05;
    font-weight: 700;
    color: var(--red);
    overflow-wrap: anywhere;
  }
  .result .hint { margin: 12px auto 0; max-width: 28ch; color: var(--muted); font-size: 15px; line-height: 1.5; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i {
    position: absolute;
    top: -12px;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .gift .wobble, .confetti { animation: none !important; display: none; }
    .gift .lid, .result, .retrato { transition: none; animation: none; }
  }
  footer { margin-top: 22px; font-size: 13px; color: var(--muted); }
</style>
</head>

  var caixaFoto = document.getElementById("foto");
  function decodificar(b64) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function confete() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cores = ["#b3262d", "#1f5c43", "#d6a23a", "#e9bd5a", "#2f7a5a"];
    var box = document.createElement("div");
    box.className = "confetti";
    for (var i = 0; i < 90; i++) {
      var p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = cores[i % cores.length];
      p.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      p.style.setProperty("--rot", (Math.random() * 900 - 450) + "deg");
      p.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      p.style.animationDelay = (Math.random() * 0.4) + "s";
      if (Math.random() < 0.4) { p.style.width = "8px"; p.style.height = "8px"; p.style.borderRadius = "50%"; }
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 4800);
  }
  var timer;
  function mostrarFoto(nome) {
    caixaFoto.textContent = "";
    if (fotoSrc) {
      var img = new Image();
      img.alt = "Foto de " + nome;
      img.src = fotoSrc;
      caixaFoto.appendChild(img);
    } else {
      var ini = document.createElement("span");
      ini.className = "inicial";
      ini.textContent = nome.charAt(0).toUpperCase();
      caixaFoto.appendChild(ini);
    }
  }
  function revelar() {
    if (app.classList.contains("opened")) return;
    var nome = decodificar(dado);
    alvo.textContent = nome;
    mostrarFoto(nome);
    app.classList.add("opened");
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
    var espera = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 550;
    timer = setTimeout(function () {
      app.classList.add("revealed");
      confete();
    }, espera);
  }
  function esconder() {
    clearTimeout(timer);
    app.classList.remove("opened", "revealed");
    alvo.textContent = "";
    caixaFoto.textContent = "";
  }
  document.getElementById("gift").addEventListener("click", revelar);
  document.getElementById("revelar").addEventListener("click", revelar);
  document.getElementById("esconder").addEventListener("click", esconder);
})();
